<!DOCTYPE html>
<html lang="es">
<head>

<style>

.contenido{text-align:center;z-index:10;padding:20px}
.contenido h1{color:#f7ff00;font-size:clamp(1.4rem,4vw,2.2rem);letter-spacing:3px;line-height:1.4;text-shadow:0 0 8px #f7ff00,0 0 20px #f7ff00;font-weight:700}
.contenido h2{margin-top:35px;color:#f7ff00;font-size:1.1rem;text-shadow:0 0 8px #f7ff00}
.contenido p{margin-top:35px;color:white;font-size:1rem;letter-spacing:2px;text-shadow:0 0 8px white}
#btnRegalo{margin-top:35px;padding:12px 28px;background:black;border:2px solid #8a2be2;color:#8a2be2;font-family:inherit;letter-spacing:3px;cursor:pointer;box-shadow:0 0 10px #ff00ff,0 0 20px #8a2be2}

#regalo.activa{display:flex}
#frase{text-align:center;min-height:110px;margin-bottom:5px;width:90%;z-index:10}
.linea1{font-family:'Great Vibes',cursive;font-size:clamp(2.1rem,6.5vw,3.4rem);color:#ff9ec5;text-shadow:0 0 15px #ff4d8d,0 0 35px #ff9ec5;line-height:1.1}
.linea2{font-family:'Courier Prime',monospace;font-size:clamp(1rem,3vw,1.3rem);color:#ffeaa7;letter-spacing:4px;margin-top:12px;text-shadow:0 0 10px gold}
canvas#flor{width:min(88vw,520px);height:min(88vw,520px);z-index:10}
.petalo{position:absolute;top:-10%;pointer-events:none;animation:caerPetalo linear forwards;z-index:20}
@keyframes caerPetalo{
0%{transform:translateY(-5vh) translateX(0) rotate(0deg);opacity:0}
10%{opacity:1}
90%{opacity:1}
100%{transform:translateY(110vh) translateX(100px) rotate(720deg);opacity:0}
}
</style>
</head>
<body>
<div id="stars"></div>
<div id="inicio">
<div class="contenido">
<h1>FELIZ DÍA DE LAS FLORES<br>AMARILLAS</h1>
<h2>AMOR MÍO</h2>
<p>TENGO UN REGALO ESPECIAL PARA TI</p>
<button id="btnRegalo">VER TU REGALO</button>
</div>
</div>
<div id="regalo">
<div id="frase">
<div class="linea1">Para mi niña preciosa Vanee 💗🌻</div>
<div class="linea2">I love you</div>
</div>
<canvas id="flor" width="600" height="600"></canvas>
</div>
<script>
const bg=document.getElementById('stars');
for(let i=0;i<300;i++){
let s=document.createElement('div');s.className='star';
s.style.width=s.style.height=(Math.random()*2+0.5)+'px';
s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
s.style.opacity=Math.random();bg.appendChild(s);
}
document.getElementById('btnRegalo').addEventListener('click', ()=>{
document.getElementById('inicio').classList.add('oculto');
setTimeout(()=>{
document.getElementById('inicio').style.display='none';
document.getElementById('regalo').classList.add('activa');
iniciarFlor(); iniciarPetalos();
},1000);
});
function iniciarPetalos(){
const simbolos=['🌻','🌼','💛','✨','🌻','🌼'];
setInterval(()=>{
let p=document.createElement('div');p.className='petalo';
p.textContent=simbolos[Math.floor(Math.random()*simbolos.length)];
p.style.left=Math.random()*100+'%';
p.style.fontSize=(14+Math.random()*22)+'px';
let dur=3+Math.random()*5;
p.style.animationDuration=dur+'s';
document.getElementById('regalo').appendChild(p);
setTimeout(()=>p.remove(),dur*1000);
},120);
// lluvia extra desde el inicio para que se vea tupido
for(let i=0;i<25;i++){
setTimeout(()=>{
let p=document.createElement('div');p.className='petalo';
p.textContent='🌼';p.style.left=Math.random()*100+'%';
p.style.fontSize=(14+Math.random()*22)+'px';
p.style.animationDuration=(3+Math.random()*5)+'s';
document.getElementById('regalo').appendChild(p);
},i*100);
for(let i=0;i<numPetals;i++){let ang=(i/numPetals)*Math.PI*2 - Math.PI/2;drawPetal(ang,12);}drawCentro();
requestAnimationFrame(animate);
}
}animate(0);
}
</script>
</body>
